name: Build

# Builds downloadable binaries for every push and publishes releases.
#
# TWO configurations are built and published. The RELEASE configuration
# (JERICHO.exe) pre-includes only the release mods (premake5.lua
# JERICHO_RELEASE_MODS), so a download is the game and a small, legible mod set
# rather than every experimental module. The DEV configuration (Release_dev /
# JERICHO_dev) compiles every module and is what the test rigs use. Both are
# packaged per platform, so a run also refreshes the dev archives. The mp remote
# agent installs only the Release asset, JERICHO_Release_win64.zip.
#
#  - push to main        -> build + upload workflow artifacts, refresh the
#                           rolling "alpha" pre-release
#  - push a "v*" tag     -> build + publish a normal GitHub Release
#  - manual run          -> same as a push to main (great for testing)
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    # Manual runs are how a build of a WORKING BRANCH becomes something another PC
    # can install: the mp remote agent installs only a PUBLISHED release, so with
    # no way to publish a branch the only route to a test machine was hand-copying
    # the zip. Set release_tag to cut one; leave it blank to build an artifact only.
    # Deliberately no push trigger for working branches: a release per push would
    # spend CI minutes on every experiment.
    inputs:
      release_tag:
        description: >-
          Publish this ref's build as a release under this tag (blank = artifact
          only). Must match the agent's tag rule [A-Za-z0-9][A-Za-z0-9._-]* and must
          not be 'alpha' or a v* tag, which the other steps own.
        required: false
        default: ''

# Cancel a superseded run when a newer commit lands on the same ref.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SDL2_VERSION: '2.30.2'
  OPENAL_VERSION: '1.23.1'

jobs:
  # The checks that need no game: they run on every push, in seconds, and they
  # cover the class of defect that a build cannot see -- a doc that contradicts
  # the code, a debug switch that changes behaviour, and (where the assets exist)
  # a pair that no longer plays a match.
  #
  # In publish's `needs` so a TAGGED release waits for it and requires it; the
  # rolling alpha and on-demand builds still publish when it is red (a doc typo must
  # not stop a downloadable build there). See publish's `if`.
  checks:
    name: Checks (docs / debug / mp gate / servers)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Docs are consistent (links, events, indexed, counted claims)
        run: python tools/doccheck.py

      - name: No debug switch changes behaviour
        run: python JERICHO/MODS/mp/tools/check_debug_independence.py

      # The server-side tools are pure Python and need no game assets, so unlike
      # the rigs below they really run here: the wire-mirror guard (which caught a
      # real MP_WELCOME drift), the master discovery self-test, and the
      # master + dedicated-server + client end-to-end path -- all loopback only.
      # check_images is here because a shared module that no Dockerfile COPYs builds
      # an image that dies at import, on the box, at the worst moment.
      - name: mp servers (wire mirror, image copies, master self-test, master+dedi e2e)
        run: |
          python3 JERICHO/MODS/mp/tools/servers/proto_check.py
          python3 JERICHO/MODS/mp/tools/servers/check_images.py
          python3 JERICHO/MODS/mp/tools/servers/console_selftest.py
          python3 JERICHO/MODS/mp/tools/servers/masterserver/test_masterserver.py
          python3 JERICHO/MODS/mp/tools/servers/masterserver/test_console.py
          python3 JERICHO/MODS/mp/tools/servers/masterserver/test_probe.py
          python3 JERICHO/MODS/mp/tools/servers/dediserver/test_console.py
          python3 JERICHO/MODS/mp/tools/servers/dediserver/test_plugins.py
          python3 JERICHO/MODS/mp/tools/servers/test_console_stdin.py
          python3 JERICHO/MODS/mp/tools/servers/rigs/test_e2e.py

      # The shell entry points are Linux-only by definition, so THIS is the platform
      # that can check them: parse every one, and run the servers' dispatcher, whose
      # `help` path exercises the file without starting anything.
      - name: mp shell entry points (Linux)
        run: |
          for f in JERICHO/MODS/mp/tools/*.sh JERICHO/MODS/mp/tools/servers/run.sh; do
            echo "-- $f"
            sh -n "$f"
          done
          sh JERICHO/MODS/mp/tools/servers/run.sh help

      # The rigs cannot PASS on a hosted runner: they need the 1.6 GB of game data
      # and a window per seat. run_gate.py answers 2 for exactly that case, which is
      # a SKIP and not a pass -- so it is announced rather than silently green. It
      # runs ALL THREE rigs where the assets ARE present, so the same command is the
      # local gate and the CI gate. Point this job at a self-hosted runner with the
      # game to get the real verdict, and pass --require-assets on the release job so
      # that "no assets" fails (3) instead of skipping.
      - name: mp delivery gate (skips where the game assets are absent)
        run: |
          python3 JERICHO/MODS/mp/tools/run_gate.py || code=$?
          code=${code:-0}
          if [ "$code" -eq 2 ]; then
            echo "::notice title=mp gate::SKIPPED - no game assets on this runner; run run_gate.py where the game is installed"
          elif [ "$code" -ne 0 ]; then
            exit "$code"
          fi

  windows:
    name: Windows (x64)
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      SDL2_DIR: "${{ github.workspace }}/src_rebuild/dependencies/SDL2-2.30.2"
      OPENAL_DIR: "${{ github.workspace }}/src_rebuild/dependencies/openal-soft-1.23.1-bin"
      JPEG_DIR: "${{ github.workspace }}/src_rebuild/dependencies/jpeg-9d"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Deliberately NOT `submodules: recursive`. That walks every entry in
          # .gitmodules, and a single unfetchable submodule fails the whole
          # checkout before any build step runs -- which is exactly how this
          # job spent its entire life failing at step 2. JERICHO/MODS/gaildrv2 and JERICHO/MODS/d1cars
          # is deliberately out of the picture for builds (its repository is
          # not published), so only the submodules the build needs are fetched,
          # explicitly, in the step below.
          submodules: false
          # Full history and tags. With a shallow clone `git describe` finds no
          # reachable tag and silently falls back to a bare SHA, so the version a
          # build reports says nothing and cannot be compared across builds.
          fetch-depth: 0
          fetch-tags: true

      - name: Fetch build submodules
        shell: bash
        run: |
          # An explicit allow-list rather than `--recursive`: adding a submodule
          # to .gitmodules must not be able to break the build by itself.
          for path in src_rebuild/PsyCross; do
            echo "::group::submodule $path"
            git submodule update --init --depth=1 "$path"
            echo "::endgroup::"
          done

      - name: Download dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $deps = 'src_rebuild/dependencies'
          New-Item -ItemType Directory -Force -Path $deps | Out-Null

          # Every archive is pinned by SHA-256 and fetched over https (Refs #8). A
          # version bump in env: must update its hash here too, or the step fails.
          function Get-Pinned([string]$url, [string]$out, [string]$sha256) {
            Invoke-WebRequest $url -OutFile $out
            $got = (Get-FileHash $out -Algorithm SHA256).Hash.ToLower()
            if ($got -ne $sha256) { throw "checksum mismatch for ${out}: got $got, want $sha256" }
          }

          Get-Pinned 'https://github.com/premake/premake-core/releases/download/v5.0.0-beta1/premake-5.0.0-beta1-windows.zip' premake5.zip 'd8f958162b202fe88a2fa1897d3c5342dd137f19d1265de8802880126a808a65'
          Expand-Archive premake5.zip -DestinationPath src_rebuild -Force

          Get-Pinned 'https://github.com/libsdl-org/SDL/releases/download/release-${{ env.SDL2_VERSION }}/SDL2-devel-${{ env.SDL2_VERSION }}-VC.zip' sdl2.zip 'fc5d6c096a6b82f86613060dfef553a09b9e08afcb401fefac4b9ca221265cda'
          Expand-Archive sdl2.zip -DestinationPath $deps -Force

          Get-Pinned 'https://github.com/kcat/openal-soft/releases/download/${{ env.OPENAL_VERSION }}/openal-soft-${{ env.OPENAL_VERSION }}-bin.zip' openal.zip 'ea8bc36fd7fa05f64e13400d20886de753a227202a4ea3781913489a26b36fc6'
          Expand-Archive openal.zip -DestinationPath $deps -Force

          Get-Pinned 'https://www.ijg.org/files/jpegsr9d.zip' jpeg.zip '5dc857551201d749dc0f48d26aa4cde9f6b53fe65080cbed9cb6641479119433'
          Expand-Archive jpeg.zip -DestinationPath $deps -Force

          # libjpeg ships jconfig.vc; the project expects jconfig.h
          Move-Item "$deps/jpeg-9d/jconfig.vc" "$deps/jpeg-9d/jconfig.h" -Force

      - name: Settle and report the version this build will embed
        shell: bash
        run: |
          # -dirty must mean the tree really differs from the commit, not that the
          # index's stat cache is stale. A fresh CI checkout can leave that cache
          # stale, and `git describe` then appends -dirty to a RELEASED binary's
          # version - 0.9.0 shipped as 0.9.0-dirty, on both platforms. Refreshing
          # the cache is the fix and it changes no file, so a genuinely dirty
          # developer tree still reports -dirty.
          git update-index -q --refresh || true
          echo "git describe: $(git describe --tags --always --dirty)"
          echo "porcelain:    $(git status --porcelain | wc -l) path(s)"
          git status --porcelain | head -10 || true
          echo "diff-index:   $(git diff-index --name-only HEAD | wc -l) path(s)"
          git diff-index --name-only HEAD | head -10 || true

      - name: Generate project files (vs2022)
        working-directory: src_rebuild
        run: .\premake5.exe vs2022

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build (Release, Release_dev)
        shell: pwsh
        run: |
          # exports.def is produced by gen_exports from a LINKER MAP, and the
          # committed copy is stale by construction: it holds whatever the last
          # local build emitted (an x64 Release_dev map). It is handed to the
          # linker for EVERY configuration, so any symbol removed since then --
          # or every symbol at all on another architecture, where the C++
          # decoration differs -- fails with hundreds of LNK2001s. Linking this
          # job's x86 build against that x64 def is why Windows never produced
          # a binary, and therefore never a release.
          #
          # So build it per configuration: link once against a throwaway empty
          # def (that pass is what writes the .map), regenerate the def from
          # that map, then relink. The relink is incremental -- only the exe.
          #
          # BOTH configurations are built. exports.def is regenerated per config
          # from that config's own map, and each config's pass 2 relink runs
          # before the next config resets the def, so the two exes never share a
          # def generated for the other one.
          foreach ($cfg in @('Release', 'Release_dev')) {
            $exe = if ($cfg -eq 'Release') { 'JERICHO' } else { 'JERICHO_dev' }

            Write-Host "::group::msbuild $cfg (pass 1: empty def, emits the map)"
            Set-Content -Path src_rebuild/exports.def -Value 'EXPORTS'
            msbuild src_rebuild/build/JERICHO.sln /p:Configuration=$cfg /p:Platform=x64 /m /nologo /v:m
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Write-Host "::endgroup::"

            Write-Host "::group::gen_exports $cfg + relink (pass 2)"
            & "src_rebuild/bin/$cfg/gen_exports.exe" "src_rebuild/bin/$cfg/$exe.map" "src_rebuild/exports.def"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            msbuild src_rebuild/build/JERICHO.sln /p:Configuration=$cfg /p:Platform=x64 /m /nologo /v:m
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Write-Host "::endgroup::"
          }

      - name: Package
        shell: pwsh
        run: |
          # Driver 1 bake tooling. JERICHO ships the WAY to bake, never the baked
          # data -- that is derived from Driver 1's copyrighted files. The tools
          # live in the d1cars submodule, whose folder the dev mirror EXCLUDES
          # (JER_MIRROR_EXCLUDE) and the build never fetches, so they are pulled
          # from that repo for packaging only. The URL comes from .gitmodules, so
          # it cannot drift from the submodule entry.
          $d1url = (git config -f .gitmodules --get submodule.JERICHO/MODS/d1cars.url)
          git clone --quiet --depth 1 "$d1url" "$env:RUNNER_TEMP/d1cars"

          foreach ($cfg in @('Release', 'Release_dev')) {
            $bin = "src_rebuild/bin/$cfg"
            # runtime DLLs bundled next to the exe (x64)
            Copy-Item "$env:SDL2_DIR/lib/x64/SDL2.dll" "$bin/SDL2.dll" -Force
            Copy-Item "$env:OPENAL_DIR/bin/Win64/soft_oal.dll" "$bin/OpenAL32.dll" -Force
            # game data (the post-build step already mirrored JERICHO/ into $bin)
            Copy-Item "data/*" "$bin/" -Recurse -Force

            # Ship the GAME, not the build tree. The archive used to carry FontTool.exe,
            # gen_exports.exe, the MSVC import/static libraries (*.lib, *.exp) and the
            # PsyCross / JERICHO_runtime symbol files beside the game - none of which a
            # player runs, and none of which is linked at run time. JERICHO.pdb and
            # JERICHO.map STAY: tools/dmp_fault.py and tools/map_lookup.py need them to
            # attribute a crash from a dump.
            Remove-Item "$bin/FontTool.exe", "$bin/FontTool.pdb",
                        "$bin/gen_exports.exe", "$bin/gen_exports.pdb",
                        "$bin/JERICHO_runtime.pdb", "$bin/PsyCross.pdb" `
                        -Force -ErrorAction SilentlyContinue
            Get-ChildItem "$bin/*" -File |
              Where-Object { $_.Extension -in @('.lib', '.exp', '.a', '.obj', '.idb') } |
              Remove-Item -Force -ErrorAction SilentlyContinue

            # Three things a release must never carry.
            #
            # 1. CONFIG/modlist.ini -- the player's module toggles. An archive cannot
            #    ask before replacing it, so a release ships none and each module runs
            #    from its mod.toml default. (A Release build deletes it already; this
            #    is the belt to that brace, in case a stale bin is packaged.)
            # 2. DRIVER/ -- the Driver 1 car data. JERICHO ships the WAY to bake it,
            #    never the data: that is derived from Driver 1's copyrighted files, and
            #    the player bakes their own with the tooling this package carries.
            # 3. DRIVER2/ -- the game data (levels, models, cutscenes). The repo's
            #    copy is placeholder data, and the real files are the player's own
            #    Driver 2 data, which they drop in beside the exe.
            Remove-Item "$bin/JERICHO/CONFIG/modlist.ini" -Force -ErrorAction SilentlyContinue
            Remove-Item "$bin/DRIVER" -Recurse -Force -ErrorAction SilentlyContinue
            Remove-Item "$bin/DRIVER2" -Recurse -Force -ErrorAction SilentlyContinue

            # 4. Car-data BANKS -- BetterCars-style car packs (BC*.LEV / BC*.LCF) and
            #    the *.sparse.bak a local bankfill leaves. Third-party car ART, the
            #    same rule as DRIVER/: a package ships the tools that complete and read
            #    a bank, never the banks. An install may hold them beside DRIVER2\; a
            #    package may not - so FAIL instead of sweeping, which is what catches a
            #    bank that ever gets committed into data/ or JERICHO/.
            $banks = @(Get-ChildItem $bin -Recurse -File -ErrorAction SilentlyContinue |
                Where-Object { $_.Name -like 'BC*.LEV' -or $_.Name -like 'BC*.LCF' -or
                               $_.Name -like '*.sparse.bak' -or $_.DirectoryName -like '*BetterCars*' })
            if ($banks.Count -gt 0) {
                throw "refusing to package car-data banks (third-party car art): $($banks[0].FullName)"
            }

            # The bake tools, and both bake scripts at the package root beside the
            # exe. A player drops their own Driver 1 data into DRIVER\ and runs
            # BAKE_D1_CARS.bat (or .sh) once; carhacks offers the five cities from
            # then on. See docs/CI.md.
            $d1dst = "$bin/JERICHO/MODS/d1cars/tools"
            New-Item -ItemType Directory -Force -Path $d1dst | Out-Null
            Copy-Item "$env:RUNNER_TEMP/d1cars/tools/*.py" $d1dst -Force
            Copy-Item "$env:RUNNER_TEMP/d1cars/tools/README.md" "$bin/JERICHO/MODS/d1cars/" -Force
            Copy-Item "JERICHO/MODS/mp/tools/pack_lan/BAKE_D1_CARS.bat" "$bin/" -Force
            Copy-Item "JERICHO/MODS/mp/tools/pack_lan/BAKE_D1_CARS.sh" "$bin/" -Force
            # The updater, both spellings so a player on either OS has one. It
            # fetches the latest RELEASE (never the alpha pre-release), verifies the
            # checksum, and copies over the install while leaving CONFIG/ and DRIVER/
            # alone - so it is safe to hand somebody instead of "re-download and
            # work out which files are yours".
            Copy-Item "JERICHO/MODS/mp/tools/pack_lan/update_jericho.bat" "$bin/" -Force
            Copy-Item "JERICHO/MODS/mp/tools/pack_lan/update_jericho.sh" "$bin/" -Force
            Copy-Item "JERICHO/MODS/mp/tools/pack_lan/merge_config.ps1" "$bin/" -Force

            # 5. The DEDICATED SERVER -- and ONLY the dedicated server.
            #    A player who wants to leave a match running needs the Python dedi,
            #    and it is not in the mirror (every mod's tools/ directory is
            #    stripped on the way in), so it is staged here like the bake tools.
            #    Its own imports decide the payload: dediserver.py pulls in
            #    serverkit, mp_test (the one Python copy of the wire) and
            #    proto_check, and proto_check reads mp_proto.h out of the mirror.
            #
            #    The MASTER discovery service is NOT shipped: it is the shared
            #    service every install points at, so an install running its own
            #    would only fragment the player base -- and it is infrastructure,
            #    not a feature of the game. Fail rather than trust the copy rules,
            #    so a stray masterserver/ can never ride out in a release.
            $mpTools = "JERICHO/MODS/mp/tools"
            $srvDst = "$bin/JERICHO/MODS/mp/tools/servers"
            New-Item -ItemType Directory -Force -Path $srvDst | Out-Null
            Copy-Item "$mpTools/mp_test.py" "$bin/JERICHO/MODS/mp/tools/" -Force
            Copy-Item "$mpTools/servers/*.py" $srvDst -Force
            Copy-Item "$mpTools/servers/*.md" $srvDst -Force
            Copy-Item "$mpTools/servers/run.bat" $srvDst -Force
            Copy-Item "$mpTools/servers/run.sh" $srvDst -Force
            Copy-Item "$mpTools/servers/dediserver" $srvDst -Recurse -Force
            Get-ChildItem "$bin/JERICHO/MODS/mp/tools" -Recurse -Directory -Filter '__pycache__' |
                Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
            if (Test-Path "$bin/JERICHO/MODS/mp/tools/servers/masterserver") {
                throw "refusing to package the master server: it is our infrastructure, not the player's"
            }

            Compress-Archive -Path "$bin/*" -DestinationPath "JERICHO_${cfg}_win64.zip" -Force
          }

      - name: Upload Release (win64) artifact
        uses: actions/upload-artifact@v4
        with:
          name: JERICHO_Release_win64
          path: JERICHO_Release_win64.zip
          if-no-files-found: warn

      - name: Upload Release_dev (win64) artifact
        uses: actions/upload-artifact@v4
        with:
          name: JERICHO_Release_dev_win64
          path: JERICHO_Release_dev_win64.zip
          if-no-files-found: warn

  linux:
    name: Linux (x86_64)
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # See the Windows job: an explicit allow-list instead of
          # `submodules: recursive`, so an unpublished submodule cannot fail
          # the checkout. gaildrv2 and d1cars are out of the picture for builds.
          submodules: false
          # See the Windows job: without full history and tags, `git describe`
          # falls back to a bare SHA.
          fetch-depth: 0
          fetch-tags: true

      - name: Fetch build submodules
        shell: bash
        run: |
          for path in src_rebuild/PsyCross; do
            echo "::group::submodule $path"
            git submodule update --init --depth=1 "$path"
            echo "::endgroup::"
          done

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libsdl2-dev libopenal-dev libjpeg-turbo8-dev libgl1-mesa-dev

      - name: Download premake5
        run: |
          curl -fL https://github.com/premake/premake-core/releases/download/v5.0.0-beta1/premake-5.0.0-beta1-linux.tar.gz -o premake5.tar.gz
          echo '074fc07be17888ef41ca07eea1c527c390a04ea4550bf7962eeb0bea0cc9d2f5  premake5.tar.gz' | sha256sum -c -   # Refs #8
          tar xf premake5.tar.gz -C src_rebuild
          chmod +x src_rebuild/premake5

      - name: Settle and report the version this build will embed
        shell: bash
        run: |
          # See the Windows job: refresh the index cache first, so -dirty means a
          # real difference and not a stale stat cache, then report the string.
          git update-index -q --refresh || true
          echo "git describe: $(git describe --tags --always --dirty)"
          echo "porcelain:    $(git status --porcelain | wc -l) path(s)"
          git status --porcelain | head -10 || true
          echo "diff-index:   $(git diff-index --name-only HEAD | wc -l) path(s)"
          git diff-index --name-only HEAD | head -10 || true

      - name: Generate project files (gmake2)
        working-directory: src_rebuild
        run: ./premake5 gmake2

      - name: Build (release_x64, release_dev_x64)
        working-directory: src_rebuild/build
        run: |
          for cfg in release_x64 release_dev_x64; do
            echo "::group::make $cfg"
            set +e
            make config=$cfg -j"$(nproc)" 2>&1 | tee "/tmp/make-$cfg.log"
            rc=${PIPESTATUS[0]}
            if [ "$rc" -ne 0 ]; then
              # A PARALLEL build of the generated makefile is flaky on Linux: it can
              # fail at the exe's link/post-build step (JERICHO.make) while the same
              # build serially succeeds. Objects are already built by this point, so a
              # -j1 retry only re-runs the failing step -- cheap, and it is what makes
              # this job's green actually mean "Linux builds". If the retry ALSO
              # fails, annotate its tail: job LOGS need admin rights to download, but
              # annotations are public, so a red build stays legible from the commit.
              echo "::warning title=$cfg::parallel build failed - retrying serially"
              # ...but a retry only helps if it RE-RUNS what failed. Premake puts the
              # post-build mirror in the LINK rule, so when the link itself succeeded
              # and only the mirror failed, make sees the target as up to date and
              # "retries" by doing nothing - exiting 0 over a real failure. That is
              # exactly how the Linux package shipped with no JERICHO/ tree (no MODS,
              # no CONFIG, no CORE) while this job stayed green: the mirror's
              # `mkdir -p ../bin/Release/JERICHO/MODS` was failing against the exe of
              # the same name. Drop the target so the rule, and the mirror with it,
              # runs again. Both spellings, so this survives the targetname change.
              # The output dir is bin/<buildcfg>: Release for release_x64,
              # Release_dev for release_dev_x64. Drop the exe (every spelling) so
              # the link rule, and the mirror inside it, actually re-runs.
              case "$cfg" in release_dev_x64) bincfg=Release_dev ;; *) bincfg=Release ;; esac
              rm -f "../bin/$bincfg/jericho" "../bin/$bincfg/JERICHO" "../bin/$bincfg/JERICHO_dev"
              make config=$cfg -j1 2>&1 | grep -v '^==== ' | tail -10 | while IFS= read -r line; do
                [ -n "$line" ] && echo "::error title=$cfg::${line}"
              done
              rc=${PIPESTATUS[0]}
            fi
            set -e
            if [ "$rc" -ne 0 ]; then
              echo "::endgroup::"
              exit "$rc"
            fi
            echo "::endgroup::"
          done

      - name: Package
        run: |
          # Driver 1 bake tooling: see the Windows job. Fetched from the d1cars
          # submodule's repo (the dev mirror excludes the folder; the build never
          # fetches it), for packaging only.
          d1url=$(git config -f .gitmodules --get submodule.JERICHO/MODS/d1cars.url)
          git clone --quiet --depth 1 "$d1url" "$RUNNER_TEMP/d1cars"

          for cfg in Release Release_dev; do
            d="src_rebuild/bin/$cfg"
            # game data (the post-build step already mirrored JERICHO/ into $d)
            cp -R data/. "$d"/
            # Ship the GAME, not the build tree: the archive used to carry FontTool,
            # gen_exports and the static libraries (libJERICHO_runtime.a, libPsyCross.a)
            # as well, none of which is run or linked by a player. The Windows package
            # keeps JERICHO.pdb/.map for crash triage; there is no equivalent here.
            # The bake tools, and both bake scripts at the package root (as on
            # Windows). chmod so BAKE_D1_CARS.sh arrives runnable.
            mkdir -p "$d/JERICHO/MODS/d1cars/tools"
            cp "$RUNNER_TEMP/d1cars/tools/"*.py "$d/JERICHO/MODS/d1cars/tools/"
            cp "$RUNNER_TEMP/d1cars/tools/README.md" "$d/JERICHO/MODS/d1cars/"
            cp JERICHO/MODS/mp/tools/pack_lan/BAKE_D1_CARS.bat "$d/"
            cp JERICHO/MODS/mp/tools/pack_lan/BAKE_D1_CARS.sh "$d/"
            chmod +x "$d/BAKE_D1_CARS.sh"
            # The updater, both spellings, same reasoning as the bake scripts above.
            cp JERICHO/MODS/mp/tools/pack_lan/update_jericho.bat "$d/"
            cp JERICHO/MODS/mp/tools/pack_lan/update_jericho.sh "$d/"
            cp JERICHO/MODS/mp/tools/pack_lan/merge_config.ps1 "$d/"
            chmod +x "$d/update_jericho.sh"
            # The DEDICATED SERVER, and only it -- the same payload as the Windows
            # job stages, same reasoning (the master discovery service is shared
            # infrastructure and is not shipped). Staged by hand because the mirror
            # never has a mod's tools/ directory: it is stripped on the way in.
            srv_dst="$d/JERICHO/MODS/mp/tools/servers"
            mkdir -p "$srv_dst"
            cp JERICHO/MODS/mp/tools/mp_test.py "$d/JERICHO/MODS/mp/tools/"
            cp JERICHO/MODS/mp/tools/servers/*.py "$srv_dst/"
            cp JERICHO/MODS/mp/tools/servers/*.md "$srv_dst/"
            cp JERICHO/MODS/mp/tools/servers/run.sh "$srv_dst/"
            cp JERICHO/MODS/mp/tools/servers/run.bat "$srv_dst/"
            cp -r JERICHO/MODS/mp/tools/servers/dediserver "$srv_dst/"
            find "$d/JERICHO/MODS/mp/tools" -name '__pycache__' -type d -prune -exec rm -rf {} +
            if [ -e "$srv_dst/masterserver" ]; then
                echo "::error::refusing to package the master server: it is our infrastructure, not the player's"
                exit 1
            fi
            # Three things a release must never carry: CONFIG/modlist.ini (the player's
            # module toggles -- an archive cannot ask before replacing them, so a
            # release ships none and each module runs from its mod.toml default),
            # DRIVER/ (the Driver 1 car data -- JERICHO ships the WAY to bake it, never
            # the data, which is derived from Driver 1's copyrighted files), and
            # DRIVER2/ (the game data -- the repo copy is placeholders; the real files
            # are the player's own Driver 2 data).
            rm -f "$d/JERICHO/CONFIG/modlist.ini"
            rm -rf "$d/DRIVER"
            rm -rf "$d/DRIVER2"

            # ...and a fourth: car-data BANKS (BetterCars-style BC*.LEV/BC*.LCF, and the
            # *.sparse.bak a local bankfill leaves). Third-party car art, same rule as
            # DRIVER/: the package ships the tools that complete and read a bank, never
            # the banks. Fail rather than sweep, so a bank committed into data/ or
            # JERICHO/ is caught here instead of shipped.
            banks=$(find "$d" \( -iname 'BC*.LEV' -o -iname 'BC*.LCF' -o \
                -iname '*.sparse.bak' -o -iname 'BetterCars' \) -print -quit)
            if [ -n "$banks" ]; then
                echo "::error::car-data bank in the package payload: $banks"
                exit 1
            fi
            ( cd "$d" && tar -czf "$GITHUB_WORKSPACE/JERICHO_${cfg}_linux-x64.tar.gz" \
                --exclude=FontTool --exclude=gen_exports --exclude='lib*.a' \
                --exclude=DRIVER --exclude=DRIVER2 --exclude='JERICHO/CONFIG/modlist.ini' * )
          done

      - name: Upload Release (linux-x64) artifact
        uses: actions/upload-artifact@v4
        with:
          name: JERICHO_Release_linux-x64
          path: JERICHO_Release_linux-x64.tar.gz
          # ERROR, not warn: a green Linux job must MEAN the artifact exists. The
          # publish job still tolerates a failed platform (that stays as it is), but
          # the Linux job itself should not pass while producing nothing.
          if-no-files-found: error

      - name: Upload Release_dev (linux-x64) artifact
        uses: actions/upload-artifact@v4
        with:
          name: JERICHO_Release_dev_linux-x64
          path: JERICHO_Release_dev_linux-x64.tar.gz
          if-no-files-found: error

  publish:
    name: Publish
    needs: [checks, windows, linux]
    # Publish whatever WAS built. Requiring both platforms to succeed meant one
    # flaky platform silently stopped EVERY release -- the wrong trade for a
    # rolling alpha, where a Windows-only artifact is still a usable download.
    # The upload steps warn instead of failing for the same reason.
    if: >-
      always() && !cancelled() &&
      github.event_name != 'pull_request' &&
      (needs.windows.result == 'success' || needs.linux.result == 'success') &&
      (!startsWith(github.ref, 'refs/tags/v') || needs.checks.result == 'success')
    # A TAGGED release additionally requires the checks job: a numbered release is
    # what people install, so a doc/debug/mp-gate failure must stop it. The rolling
    # alpha and on-demand builds stay tolerant (see the note on the checks job).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Collect build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # A checksum list published NEXT TO the archives, so a downloader (the mp
      # remote agent) can verify an asset against something that did not come
      # out of the same archive. GitHub's own per-asset "digest" is preferred
      # when present; this is the fallback. Rides along via files: dist/*.
      - name: Write SHA256SUMS
        shell: bash
        run: |
          cd dist
          find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' | LC_ALL=C sort > ../sums.list
          if [ -s ../sums.list ]; then
            xargs -d '\n' sha256sum -- < ../sums.list > SHA256SUMS
            cat SHA256SUMS
          else
            echo "::warning::no artifacts to checksum"
          fi

      # The tag's own section of CHANGELOG.md ("## vX.Y.Z" up to the next "## ")
      # goes into the release body, under the overview. No section -> empty, and
      # the release still publishes with the overview and GitHub's generated notes.
      - name: Checkout CHANGELOG.md
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/checkout@v4
        with:
          path: src
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false

      - name: Extract this tag's CHANGELOG section
        id: changelog
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME}"
          awk -v t="$tag" '
            /^## / { if (on) exit; split($0, w, " "); if (w[2] == t) { on = 1; next } }
            on { print }' src/CHANGELOG.md > notes.md || true
          [ -s notes.md ] || echo "::warning::CHANGELOG.md has no '## $tag' section"
          {
            echo 'notes<<JERICHO_NOTES_EOF'
            cat notes.md
            echo 'JERICHO_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      # Push a "v*" tag -> permanent, public GitHub Release.
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          # The overview below HEADS the notes; generate_release_notes then appends
          # GitHub's own "What's Changed" underneath it (the action concatenates
          # body + blank line + generated notes and clears the API flag itself).
          # Without a body the release page was ONLY that auto changelog, which on a
          # release with no merged pull requests is a bare "Full Changelog" link and
          # tells a first-time downloader nothing about what they are getting.
          body: |
            JERICHO is a mod host built into a fork of REDRIVER2, a source-level
            reimplementation of **Driver 2** that runs natively on PC rather than
            under an emulator. This archive carries the game, the runtime libraries,
            the frontend art the project rebuilds, and the `JERICHO/` tree the mods
            live in.

            **What to expect**

            - **Driver 2, on PC** - the whole game, with long-standing original bugs
              fixed. As with REDRIVER2 it reads its map, models and cutscenes from
              `DRIVER2/` beside the executable, so a complete install is this archive
              plus your own copy of the game's data. Cutscene video needs converting
              from your discs (`install/conv.bat` / `conv.sh`) or skipping with
              `-nofmv`.
            - **A mods menu** - *Options -> JERICHO* lists every installed module:
              enable, disable, reorder, and open each one's own page. Toggles are
              written straight back to `JERICHO/CONFIG/modlist.ini`.
            - **LAN multiplayer** (`mp`) - host or join, everyone on the same build,
              each player driving their own car (cross-city imports included). A bot
              can take a seat when you are testing alone.
            - **Any vehicle, from any city** (`carhacks`) - unlocks the cars the
              frontend hides and loads another city's vehicles into a level.
            - **Impact damage** (`crumple`) - body deformation and wheel damage on top
              of the stock damaged-model system.
            - **Driver 1 car shapes** (`d1cars`) - bake them once from your own copy of
              Driver 1 with `BAKE_D1_CARS.bat` / `BAKE_D1_CARS.sh`.
            - **Staying current** - `update_jericho.bat` / `update_jericho.sh` beside
              the game refresh this install from the newest release, keeping your
              `CONFIG/` and any module you added. Pass `dev` for the `Release_dev`
              build instead.

            `Release` ships the four modules above. `Release_dev` compiles every
            module plus the debug console and dev tooling; it exists for testing the
            mods under development.

            Windows: unzip anywhere and run `JERICHO.exe`. Linux: `tar -xzf` and run
            `./jericho`. The game writes its log and config next to the executable, so
            it does not need installing.

            ---

            ## What's new in ${{ github.ref_name }}

            ${{ steps.changelog.outputs.notes }}

            ---

            **Download the Release binary - `JERICHO_Release_win64.zip` or
            `JERICHO_Release_linux-x64.tar.gz`.** If you are not sure which one to
            pick, it is that one. **Do not download `Release_dev` unless you know what
            you are doing:** it is a developer build - every module compiled in, the
            debug console and dev tooling enabled - so it is heavier and rougher, and
            it is not what a normal install should run.
          generate_release_notes: true
          prerelease: false
          # a tag that already has a release: replace the assets rather than fail
          overwrite_files: true

      # A RE-CUT (the tag moved, the release already existed) keeps its OLD body:
      # the action only replaces assets there. So rewrite the "What's new" section
      # of whatever body the release has now from this commit's CHANGELOG notes.
      - name: Refresh release notes from CHANGELOG
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json body -q .body > body.md
          python3 - <<'PY'
          import os, re
          tag = os.environ["TAG"]
          body = open("body.md", encoding="utf-8").read()
          notes = open("notes.md", encoding="utf-8").read().strip("\n")
          head = "## What's new in " + tag
          i = body.find(head)
          if i < 0:
              raise SystemExit("release body has no '%s' heading" % head)
          j = body.find("\n---\n", i)
          j = len(body) if j < 0 else j
          body = body[:i] + head + "\n\n" + notes + "\n" + body[j:]
          open("body.md", "w", encoding="utf-8").write(body)
          PY
          gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --notes-file body.md

      # On-demand release of whatever ref this run is on, for installing on a test
      # machine:  mp_remote.py update --peer <ip> --tag <tag>
      #
      # Re-running with the same tag replaces the assets, which is the point -- the
      # tag names a line of work ("pr15"), not a moment. The agent re-checks the
      # SHA256 from GitHub every time, so a replaced asset cannot go unnoticed.
      - name: Publish on-demand release
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: ${{ inputs.release_tag }}
          body: |
            Build of ${{ github.ref_name }} at ${{ github.sha }}, published on demand.

            Install on a test machine with:

                python mp_remote.py update --peer <ip> --port 1401 --tag ${{ inputs.release_tag }}

            The mp agent accepts only JERICHO_Release_win64.zip from this release.
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: dist/*

      # Every push to main refreshes a rolling "alpha" pre-release so there
      # is always a current download until a real tag is cut. Delete this
      # step once only tagged releases should be published.
      - name: Update rolling alpha pre-release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: alpha
          name: Alpha (latest main)
          body: |
            Rolling alpha build from `main` at ${{ github.sha }}.
            Not a stable release - download and test at your own risk.

            ---

            **Download the Release binary - `JERICHO_Release_win64.zip` or
            `JERICHO_Release_linux-x64.tar.gz`.** **Do not download `Release_dev`
            unless you know what you are doing:** it is a developer build - every
            module compiled in, the debug console and dev tooling enabled.
          prerelease: true
          make_latest: false
          # the asset names repeat on every push to main, so replacing them is
          # the normal case for this one, not an error
          overwrite_files: true
          files: dist/*

name: Build

# Builds downloadable binaries for every push and publishes releases.
#
# The RELEASE configuration (JERICHO.exe) is what is built and published: it
# pre-includes only carhacks + crumple + mp (premake5.lua JERICHO_RELEASE_MODS),
# so a download is the game and three mods rather than every experimental module.
# The DEV configuration (Release_dev / JERICHO_dev.exe, every mod) is NOT built
# here and stays local. The mp remote agent installs JERICHO_Release_win64.zip.
#
#  - push to main        -> build + upload workflow artifacts, refresh the
#                           rolling "alpha" pre-release
#  - push a "v*" tag     -> build + publish a normal GitHub Release
#  - manual run          -> same as a push to main (great for testing)
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    # Manual runs are how a build of a WORKING BRANCH becomes something another PC
    # can install: the mp remote agent installs only a PUBLISHED release, so with
    # no way to publish a branch the only route to a test machine was hand-copying
    # the zip. Set release_tag to cut one; leave it blank to build an artifact only.
    # Deliberately no push trigger for working branches: a release per push would
    # spend CI minutes on every experiment.
    inputs:
      release_tag:
        description: >-
          Publish this ref's build as a release under this tag (blank = artifact
          only). Must match the agent's tag rule [A-Za-z0-9][A-Za-z0-9._-]* and must
          not be 'alpha' or a v* tag, which the other steps own.
        required: false
        default: ''

# Cancel a superseded run when a newer commit lands on the same ref.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SDL2_VERSION: '2.30.2'
  OPENAL_VERSION: '1.23.1'

jobs:
  windows:
    name: Windows (x64)
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      SDL2_DIR: "${{ github.workspace }}/src_rebuild/dependencies/SDL2-2.30.2"
      OPENAL_DIR: "${{ github.workspace }}/src_rebuild/dependencies/openal-soft-1.23.1-bin"
      JPEG_DIR: "${{ github.workspace }}/src_rebuild/dependencies/jpeg-9d"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Deliberately NOT `submodules: recursive`. That walks every entry in
          # .gitmodules, and a single unfetchable submodule fails the whole
          # checkout before any build step runs -- which is exactly how this
          # job spent its entire life failing at step 2. JERICHO/MODS/gaildrv2 and JERICHO/MODS/d1cars
          # is deliberately out of the picture for builds (its repository is
          # not published), so only the submodules the build needs are fetched,
          # explicitly, in the step below.
          submodules: false
          # Full history and tags. With a shallow clone `git describe` finds no
          # reachable tag and silently falls back to a bare SHA, so the version a
          # build reports says nothing and cannot be compared across builds.
          fetch-depth: 0
          fetch-tags: true

      - name: Fetch build submodules
        shell: bash
        run: |
          # An explicit allow-list rather than `--recursive`: adding a submodule
          # to .gitmodules must not be able to break the build by itself.
          for path in src_rebuild/PsyCross; do
            echo "::group::submodule $path"
            git submodule update --init --depth=1 "$path"
            echo "::endgroup::"
          done

      - name: Download dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $deps = 'src_rebuild/dependencies'
          New-Item -ItemType Directory -Force -Path $deps | Out-Null

          Invoke-WebRequest 'https://github.com/premake/premake-core/releases/download/v5.0.0-beta1/premake-5.0.0-beta1-windows.zip' -OutFile premake5.zip
          Expand-Archive premake5.zip -DestinationPath src_rebuild -Force

          Invoke-WebRequest 'https://github.com/libsdl-org/SDL/releases/download/release-${{ env.SDL2_VERSION }}/SDL2-devel-${{ env.SDL2_VERSION }}-VC.zip' -OutFile sdl2.zip
          Expand-Archive sdl2.zip -DestinationPath $deps -Force

          Invoke-WebRequest 'https://github.com/kcat/openal-soft/releases/download/${{ env.OPENAL_VERSION }}/openal-soft-${{ env.OPENAL_VERSION }}-bin.zip' -OutFile openal.zip
          Expand-Archive openal.zip -DestinationPath $deps -Force

          Invoke-WebRequest 'http://www.ijg.org/files/jpegsr9d.zip' -OutFile jpeg.zip
          Expand-Archive jpeg.zip -DestinationPath $deps -Force

          # libjpeg ships jconfig.vc; the project expects jconfig.h
          Move-Item "$deps/jpeg-9d/jconfig.vc" "$deps/jpeg-9d/jconfig.h" -Force

      - name: Settle and report the version this build will embed
        shell: bash
        run: |
          # -dirty must mean the tree really differs from the commit, not that the
          # index's stat cache is stale. A fresh CI checkout can leave that cache
          # stale, and `git describe` then appends -dirty to a RELEASED binary's
          # version - 0.9.0 shipped as 0.9.0-dirty, on both platforms. Refreshing
          # the cache is the fix and it changes no file, so a genuinely dirty
          # developer tree still reports -dirty.
          git update-index -q --refresh || true
          echo "git describe: $(git describe --tags --always --dirty)"
          echo "porcelain:    $(git status --porcelain | wc -l) path(s)"
          git status --porcelain | head -10 || true
          echo "diff-index:   $(git diff-index --name-only HEAD | wc -l) path(s)"
          git diff-index --name-only HEAD | head -10 || true

      - name: Generate project files (vs2022)
        working-directory: src_rebuild
        run: .\premake5.exe vs2022

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build (Release)
        shell: pwsh
        run: |
          # exports.def is produced by gen_exports from a LINKER MAP, and the
          # committed copy is stale by construction: it holds whatever the last
          # local build emitted (an x64 Release_dev map). It is handed to the
          # linker for EVERY configuration, so any symbol removed since then --
          # or every symbol at all on another architecture, where the C++
          # decoration differs -- fails with hundreds of LNK2001s. Linking this
          # job's x86 build against that x64 def is why Windows never produced
          # a binary, and therefore never a release.
          #
          # So build it per configuration: link once against a throwaway empty
          # def (that pass is what writes the .map), regenerate the def from
          # that map, then relink. The relink is incremental -- only the exe.
          foreach ($cfg in @('Release')) {
            $exe = if ($cfg -eq 'Release') { 'JERICHO' } else { 'JERICHO_dev' }

            Write-Host "::group::msbuild $cfg (pass 1: empty def, emits the map)"
            Set-Content -Path src_rebuild/exports.def -Value 'EXPORTS'
            msbuild src_rebuild/build/JERICHO.sln /p:Configuration=$cfg /p:Platform=x64 /m /nologo /v:m
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Write-Host "::endgroup::"

            Write-Host "::group::gen_exports $cfg + relink (pass 2)"
            & "src_rebuild/bin/$cfg/gen_exports.exe" "src_rebuild/bin/$cfg/$exe.map" "src_rebuild/exports.def"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            msbuild src_rebuild/build/JERICHO.sln /p:Configuration=$cfg /p:Platform=x64 /m /nologo /v:m
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Write-Host "::endgroup::"
          }

      - name: Package
        shell: pwsh
        run: |
          foreach ($cfg in @('Release')) {
            $bin = "src_rebuild/bin/$cfg"
            # runtime DLLs bundled next to the exe (x64)
            Copy-Item "$env:SDL2_DIR/lib/x64/SDL2.dll" "$bin/SDL2.dll" -Force
            Copy-Item "$env:OPENAL_DIR/bin/Win64/soft_oal.dll" "$bin/OpenAL32.dll" -Force
            # game data (the post-build step already mirrored JERICHO/ into $bin)
            Copy-Item "data/*" "$bin/" -Recurse -Force
            Compress-Archive -Path "$bin/*" -DestinationPath "JERICHO_${cfg}_win64.zip" -Force
          }

      - name: Upload Release (win64) artifact
        uses: actions/upload-artifact@v4
        with:
          name: JERICHO_Release_win64
          path: JERICHO_Release_win64.zip
          if-no-files-found: warn

  linux:
    name: Linux (x86_64)
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # See the Windows job: an explicit allow-list instead of
          # `submodules: recursive`, so an unpublished submodule cannot fail
          # the checkout. gaildrv2 and d1cars are out of the picture for builds.
          submodules: false
          # See the Windows job: without full history and tags, `git describe`
          # falls back to a bare SHA.
          fetch-depth: 0
          fetch-tags: true

      - name: Fetch build submodules
        shell: bash
        run: |
          for path in src_rebuild/PsyCross; do
            echo "::group::submodule $path"
            git submodule update --init --depth=1 "$path"
            echo "::endgroup::"
          done

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libsdl2-dev libopenal-dev libjpeg-turbo8-dev libgl1-mesa-dev

      - name: Download premake5
        run: |
          curl -fL https://github.com/premake/premake-core/releases/download/v5.0.0-beta1/premake-5.0.0-beta1-linux.tar.gz -o premake5.tar.gz
          tar xf premake5.tar.gz -C src_rebuild
          chmod +x src_rebuild/premake5

      - name: Settle and report the version this build will embed
        shell: bash
        run: |
          # See the Windows job: refresh the index cache first, so -dirty means a
          # real difference and not a stale stat cache, then report the string.
          git update-index -q --refresh || true
          echo "git describe: $(git describe --tags --always --dirty)"
          echo "porcelain:    $(git status --porcelain | wc -l) path(s)"
          git status --porcelain | head -10 || true
          echo "diff-index:   $(git diff-index --name-only HEAD | wc -l) path(s)"
          git diff-index --name-only HEAD | head -10 || true

      - name: Generate project files (gmake2)
        working-directory: src_rebuild
        run: ./premake5 gmake2

      - name: Build (release_x64)
        working-directory: src_rebuild/build
        run: |
          for cfg in release_x64; do
            echo "::group::make $cfg"
            make config=$cfg -j"$(nproc)"
            echo "::endgroup::"
          done

      - name: Package
        run: |
          for cfg in Release; do
            d="src_rebuild/bin/$cfg"
            # game data (the post-build step already mirrored JERICHO/ into $d)
            cp -R data/. "$d"/
            ( cd "$d" && tar -czf "$GITHUB_WORKSPACE/JERICHO_${cfg}_linux-x64.tar.gz" * )
          done

      - name: Upload Release (linux-x64) artifact
        uses: actions/upload-artifact@v4
        with:
          name: JERICHO_Release_linux-x64
          path: JERICHO_Release_linux-x64.tar.gz
          # ERROR, not warn: a green Linux job must MEAN the artifact exists. The
          # publish job still tolerates a failed platform (that stays as it is), but
          # the Linux job itself should not pass while producing nothing.
          if-no-files-found: error

  publish:
    name: Publish
    needs: [windows, linux]
    # Publish whatever WAS built. Requiring both platforms to succeed meant one
    # flaky platform silently stopped EVERY release -- the wrong trade for a
    # rolling alpha, where a Windows-only artifact is still a usable download.
    # The upload steps warn instead of failing for the same reason.
    if: >-
      always() && !cancelled() &&
      github.event_name != 'pull_request' &&
      (needs.windows.result == 'success' || needs.linux.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Collect build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # A checksum list published NEXT TO the archives, so a downloader (the mp
      # remote agent) can verify an asset against something that did not come
      # out of the same archive. GitHub's own per-asset "digest" is preferred
      # when present; this is the fallback. Rides along via files: dist/*.
      - name: Write SHA256SUMS
        shell: bash
        run: |
          cd dist
          find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' | LC_ALL=C sort > ../sums.list
          if [ -s ../sums.list ]; then
            xargs -d '\n' sha256sum -- < ../sums.list > SHA256SUMS
            cat SHA256SUMS
          else
            echo "::warning::no artifacts to checksum"
          fi

      # Push a "v*" tag -> permanent, public GitHub Release.
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: false
          # a tag that already has a release: replace the assets rather than fail
          overwrite_files: true

      # On-demand release of whatever ref this run is on, for installing on a test
      # machine:  mp_remote.py update --peer <ip> --tag <tag>
      #
      # Re-running with the same tag replaces the assets, which is the point -- the
      # tag names a line of work ("pr15"), not a moment. The agent re-checks the
      # SHA256 from GitHub every time, so a replaced asset cannot go unnoticed.
      - name: Publish on-demand release
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: ${{ inputs.release_tag }}
          body: |
            Build of ${{ github.ref_name }} at ${{ github.sha }}, published on demand.

            Install on a test machine with:

                python mp_remote.py update --peer <ip> --port 1401 --tag ${{ inputs.release_tag }}

            The mp agent accepts only JERICHO_Release_win64.zip from this release.
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: dist/*

      # Every push to main refreshes a rolling "alpha" pre-release so there
      # is always a current download until a real tag is cut. Delete this
      # step once only tagged releases should be published.
      - name: Update rolling alpha pre-release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: alpha
          name: Alpha (latest main)
          body: |
            Rolling alpha build from `main` at ${{ github.sha }}.
            Not a stable release - download and test at your own risk.
          prerelease: true
          make_latest: false
          # the asset names repeat on every push to main, so replacing them is
          # the normal case for this one, not an error
          overwrite_files: true
          files: dist/*

# JERICHO/CONFIG/cities.ini - arbitrary car-data banks, one per line.
#
# city_N = NAME, <level file>[, <colours file>]
#
# The row owns city index 11 + N, so a carhacks "import = 5:26:4" names the same
# bank tomorrow whichever of the others are installed. Paths are relative to the
# game's data folder (DRIVER2\), may use either slash style, and may step out of
# it with ".." - the BetterCars banks beside DRIVER2\ are ..\BetterCars\.
# A bank is only offered when its level file is on disk.
[cities]
# PLCHLDR: the uniform-checker stand-in car, shipped with JERICHO so that a
# vehicle whose own city is not installed still has a body to draw instead of a
# null model. It sits at the last bank row (city 26) so a baked Driver 1 bank
# (city_0..city_14) never collides with it.
city_15 = PLCHLDR, ..\JERICHO\MODS\carhacks\PLCHLDR\PLCHLDR.LEV

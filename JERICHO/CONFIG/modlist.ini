# JERICHO module list — load order and enabled state.
#
# This file is the single source of truth for which modules run and in which
# order. Line order = module load order. Enabled values: 1/0
# (true/false/enabled/disabled are also accepted).
#
# EVERY installed module under JERICHO/MODS/ is listed here EXPLICITLY. Do not
# rely on a module being absent to keep it off: a module that is not listed
# falls back to its mod.toml `default-enabled`, and several of them declare
# `default-enabled = true`. Absence used to mean "silently on", which is how
# collisiondevil/combatd2/d2pl ran unannounced and quietly rewrote the car
# handling. Now every module is pinned here, and the boot log records the
# resolution for each one:
#
#   [jericho] --- module inventory (N loaded) ---
#   [jericho]   combatd2   v0.6.0  enabled=0 src=modlist state=disabled  ...
#
# `src=modlist` means this file decided; `src=default` means the module was NOT
# listed and its mod.toml default was used (treat that as a bug — list it);
# `src=nomods` means the whole runtime was force-disabled with -nomods.
#
# The frontend (Options -> JERICHO) rewrites this file on toggle/reorder.
#
# ---------------------------------------------------------------------------
# Default install: the core game-feel modules are on; everything that replaces
# or overrides car handling/physics is OFF and must be opted into deliberately.
# ---------------------------------------------------------------------------

# --- core game feel (mod.toml default-enabled = true) ---
crumple    = 1    # vehicle deformation + wheel-damage physics
levelhacks = 1    # take-a-ride city picker / level tweaks

# --- gameplay/overhaul mods: OFF by default ---
# collisiondevil and combatd2 declare default-enabled = true, so they used to
# load even though this file never mentioned them. Both replace the stock car
# physics (collisiondevil's aacc damping + yaw kick; combatd2's gravity/spring
# GET_PHYSICS_PARAMS and its CAR_TORQUE rigid-body integrator), so they are
# pinned to 0 here. Turn one on to opt into that handling.
collisiondevil = 0
combatd2       = 0
d2pl           = 0   # camera + weapon system (mod.toml now says false too)
sandbox        = 0
example        = 0
antfarm        = 0
aidriver       = 0
gaildrv2       = 0

# --- LAN multiplayer (work in progress) ---
mp = 0

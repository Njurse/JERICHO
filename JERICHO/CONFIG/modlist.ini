# JERICHO module list — load order and enabled state.
#
# This file is the single source of truth for which modules run and in which
# order. Line order = module load order. Enabled values: 1/0
# (true/false/enabled/disabled are also accepted).
#
# EVERY installed module under JERICHO/MODS/ is listed here EXPLICITLY. Do not
# rely on a module being absent to keep it off: a module that is not listed
# falls back to its mod.toml `default-enabled`, and several of them declare
# `default-enabled = true`. Absence used to mean "silently on", which is how
# collisiondevil/cainescrossfire/d2pl ran unannounced and quietly rewrote the car
# handling. Now every module is pinned here, and the boot log records the
# resolution for each one:
#
#   [jericho] --- module inventory (N loaded) ---
#   [jericho]   cainescrossfire   v0.6.0  enabled=0 src=modlist state=disabled  ...
#
# `src=modlist` means this file decided; `src=default` means the module was NOT
# listed and its mod.toml default was used (treat that as a bug — list it);
# `src=nomods` means the whole runtime was force-disabled with -nomods.
#
# The frontend (Options -> JERICHO) rewrites this file on toggle/reorder.
#
# ---------------------------------------------------------------------------
# SHIPPED PROFILE — carhacks + crumple + multiplayer, all three activated. This
# 0.12 line is interface 3 throughout (clean-break host API): every module and
# published package declares interface = 3, and an interface-2 module is
# refused at activation.
# is what a release build runs. Everything else is 0 here so a DEV tree pins every
# module rather than letting an unlisted one fall back to its mod.toml default
# (several default ON, which is how collisiondevil/cainescrossfire/d2pl once ran
# unannounced).
#
# A RELEASE build pre-includes ONLY these three (premake5.lua JERICHO_RELEASE_MODS):
# the release exe compiles, links and mirrors only them, and premake writes the
# release's OWN modlist from that same list, so a release never names a module it
# does not carry. A DEV build keeps every mod.
#
# gaildrv2 is NOT listed at all. It is a private submodule left out of the CI
# submodule allow-list (see .github/workflows/build.yml) and excluded from the
# MODS mirror (JER_MIRROR_EXCLUDE), so a release never carries it. Listing an id
# with no installed folder would only log "modlist references unknown module".
# ---------------------------------------------------------------------------

# --- CORE SUITE: mandatory, first in the load order -------------------
# carhacks, bake, pedhacks and mp are one product. The engine forces them enabled when
# installed and moves them to the front (jer_manager_normalize_core), including
# after a join; keep them in this order here so the file matches what runs.
carhacks  = 1   # vehicle unlock + cross-city car imports (JERICHO/MODS/carhacks/)
bake      = 1   # BAKE Toolkit: Driver 1 car-data banks (JERICHO/MODS/bake/)
pedhacks  = 1   # JMPPED pedestrian asset module (JERICHO/MODS/pedhacks/)
mp        = 1   # LAN multiplayer (JERICHO/MODS/mp/)

# --- optional modules: after the core suite, in the player's order -----
crumple   = 1   # vehicle deformation + wheel-damage physics (JERICHO/MODS/crumple/)
fulltwist = 0   # FULL TWIST: severe off-centre collision tumbles (repo-distributed, not bundled in Release; JERICHO/MODS/fulltwist/)
levelhacks = 0  # OFF: mp owns the take-a-ride Singleplayer / Multiplayer prompt now
                # (its mp.mode menu), and it needs the city-confirm hook this module
                # used to answer, so running both would stack two prompts on one
                # confirm. The module stays in the tree for its Driver 1 work.

# --- everything else: OFF for releases ---
yarisbounce    = 0   # squishy-Yaris body squash & stretch (render-only)
collisiondevil = 0   # replaces stock car physics (aacc damping + yaw kick)
cainescrossfire = 0  # replaces stock car physics (gravity/spring + CAR_TORQUE integrator)
d2pl           = 0   # on-foot movement + aim pose, laser, debug pistol (JERICHO/MODS/d2pl/)
sandbox        = 0
example        = 0
antfarm        = 0
JerAI          = 0   # AI driver for the player's car: A* + behaviors (JERICHO/MODS/JerAI/)

# --- debug/tooling ---
# debugorbit is a camera-only addon: the camera takes over at level start and
# orbits the player at a fixed radius, never handing the camera back. Never
# ship it on.
debugorbit     = 0   # Debug Orbit Camera (JERICHO/MODS/debugorbit/README.md) - CAPTURE ONLY.

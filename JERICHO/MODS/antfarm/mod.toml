id = "antfarm"
name = "Ant Farm Screensaver"
version = "0.2.0"
# the JERICHO interface (SDK) this mod is built against
interface = 3
author = "REDRIVER2 community"
description = "Passive city observer / idle screensaver: tours the map with 17 cinematic camera angles - roadside tripod/overhead/kerb, flyover and crane dollies, an orbit, waterfront drift, a junction vantage, and six angles locked onto a moving car (fender, sill, nose-3/4 and tail-3/4 rigs plus a zooming tripod and a long-lens far pan) - with gentle fades while the city keeps living."
dependencies = []
default-enabled = false

# Ant Farm drives the CAMERA itself and pins the player's car, so it cannot share
# a live session with mp. That is a RUNTIME gate, not a manifest one: mp is a
# core, default-enabled module (it owns the Single Player / Multiplayer prompt),
# so `incompatible = ["mp"]` would refuse Ant Farm on every boot and there would
# be no single-player left to run it in. Instead the module checks
# jer_net_is_active() itself: it stands down while a multiplayer session is live
# and re-engages when the session ends.
incompatible = []

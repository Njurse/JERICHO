id = "fulltwist"
name = "FULL TWIST"
version = "0.4.3"
# the JERICHO interface (SDK) this mod is built against
interface = 3
author = "JERICHO"
description = "Free-physics tumbles: cars keep their spin after a hit, scenery torque uses the convex hull contact, walls bounce, and car-car recoil is tamed."
dependencies = []
# OFF out of the box: a physics-feel experiment that no release ships until it
# has been played. Turn it on in Options -> JERICHO.
default-enabled = false
# External addon: built with the standalone SDK against interface 3. The host
# API is append-only, so this DLL does not need a game rebuild.
runtime = "dll"


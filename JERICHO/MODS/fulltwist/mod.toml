id = "fulltwist"
name = "FULL TWIST"
version = "0.3.4"
# the JERICHO interface (SDK) this mod is built against
interface = 2
author = "JERICHO"
description = "Free-physics tumbles: cars keep their spin after a hit, scenery torque uses the convex hull contact, walls bounce, and car-car recoil is tamed."

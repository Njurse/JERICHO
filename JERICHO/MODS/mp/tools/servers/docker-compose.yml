# The two mp services, for a test server or a VPS.
#
#   cd JERICHO/MODS/mp/tools/servers
#   docker compose up -d --build
#   docker compose logs -f
#   docker compose ps
#   docker compose down
#
# Override anything an env var covers without editing this file, either inline
# (`MASTER_PORT=8200 docker compose up -d`) or from a .env beside it.
#
#   MASTER_PORT      8100      the master's HTTP port (players point master_url here)
#   LOG_LEVEL        info      the master's log level
#
# The DEDICATED SERVER is configured by tools/servers/dediserver/dediserver.json,
# which this file mounts read-only: its name, city, rules, max players, session
# port, `master` URL, advertise host/port, beacon and log level all come from
# there. Open the port THAT file names (1318 as shipped) in the firewall.
#
#   ...and do not point its `master` at 127.0.0.1. The master lists the address it
#   saw the registration from, so a loopback registration is advertised to the
#   internet as "127.0.0.1" -- a listing that works on this box and nowhere else.
#   The dedi warns, in its log and on its console, when that happens.
#
# NETWORKING: host mode for both, deliberately.
#   * The dedi's LAN beacon is a UDP broadcast to 255.255.255.255, which a bridge
#     network keeps entirely to itself -- no machine outside the container could
#     ever hear it.
#   * The tested configuration is the two processes talking over the host's own
#     interfaces; host mode is that same configuration.
#   * Consequence on a Linux VPS: these are the HOST's ports now, so open the
#     master's TCP port and the dedi's session port (its `port` in
#     dediserver.json, 1318 as shipped) -- and, only if you want LAN discovery,
#     UDP 1318. Nothing is published by compose.
#   * Docker Desktop on Windows/macOS does not do host networking the same way;
#     run it on Linux, or see the README for the bridge alternative.
#
# The two JSON configs stay on the host and are mounted READ-ONLY: they are the
# single source of truth, editable without a rebuild. Flags below win over them.
name: jericho-mp

services:
  master:
    build:
      context: ../..
      dockerfile: tools/servers/masterserver/Dockerfile
    image: jericho-mp-master
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./masterserver/masterserver.json:/mp/tools/servers/masterserver/masterserver.json:ro
      # the registry survives a restart: a re-deploy does not blank the listing
      - master-data:/data
    command:
      - python
      - -u
      - masterserver.py
      - --config
      - masterserver.json
      - --port
      - "${MASTER_PORT:-8100}"
      - --persist
      - /data/servers.json
      - --log-level
      - "${LOG_LEVEL:-info}"
    healthcheck:
      # the master's own liveness endpoint, so `depends_on` below means something
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:${MASTER_PORT:-8100}/v1/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  dedi:
    build:
      context: ../..
      dockerfile: tools/servers/dediserver/Dockerfile
    image: jericho-mp-dedi
    restart: unless-stopped
    network_mode: host
    depends_on:
      master:
        condition: service_healthy
    volumes:
      - ./dediserver/dediserver.json:/mp/tools/servers/dediserver/dediserver.json:ro
      # the log, so a dropped client overnight is still legible (appended, never truncated)
      - dedi-data:/data
    # THE CONFIG IS dediserver/dediserver.json. This file mounted it read-only, and
    # the only things passed here are the two that cannot live in it: which file to
    # read, and where the container's log goes. It used to pass --name/--city/--rules/
    # --max-players/--master/--beacon too, with defaults of its own -- and command
    # line beats the config, so editing the JSON quietly did nothing and the server
    # came up with a name and a loopback master nobody had asked for.
    command:
      - python
      - -u
      - dediserver.py
      - --config
      - dediserver.json
      - --log-file
      - /data/dedi.log
    stop_grace_period: 15s    # room for the unregister-on-stop round trip

volumes:
  master-data:
  dedi-data:

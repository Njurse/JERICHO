# LAN build (JERICHO mp) -- copied whole, so the two machines agree on the port, the
# name and the build policy. (The mod-set digest is a separate stamp and does NOT
# have to agree -- see README_LAN's "STAYING ON THE SAME BUILD".)
# strict_version = 1 REFUSES a join when the other machine runs a different BUILD
# -- the release-series stamp, not the mod list. A different MOD SET is not
# refused: the joiner is told on screen and the session carries on.
strict_version = 1
# The session port the HOST listens on and a bare -join uses. A config port WINS
# over a -host/-join port, so this line, PLAY_HOST/PLAY_JOIN and the firewall rule
# in README_LAN have to say the same number.
port = 1400
player_name = Micheal
host_name = Micheal's game

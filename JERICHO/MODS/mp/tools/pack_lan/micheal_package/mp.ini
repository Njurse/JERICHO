# LAN build (JERICHO mp) -- copied whole, so the two machines' digests match.
# strict_version = 1 REFUSES a join when the other machine runs a different build.
strict_version = 1
# The session port the HOST listens on and a bare -join uses. A config port WINS
# over a -host/-join port, so this line, PLAY_HOST/PLAY_JOIN and the firewall rule
# in README_LAN have to say the same number.
port = 1400
player_name = Micheal
host_name = Micheal's game
